<!DOCTYPE html>

    <div class="member-app" id="member-app" hidden>

          <button class="member-signout" type="button" id="member-signout">SIGN OUT</button>

      <main class="member-content">
        <section class="member-intro"><div><span class="member-kicker">YOUR ACCOUNT</span><h1 id="member-name">MEMBER PROFILE</h1><p id="member-id"></p></div><div class="member-status" id="member-status">LOADING</div></section>

        <section class="member-section"><div class="section-heading"><span>04</span><h2>ATTENDANCE</h2></div><div class="member-table-wrap" id="member-attendance"></div></section>
        <section class="member-section" id="member-notifications-section">
          <div class="section-heading-row">
            <div class="section-heading"><span>05</span><h2>NOTIFICATIONS</h2></div>
            <div class="member-notif-actions">
              <button type="button" class="member-tab active" data-notif-filter="all">ALL</button>
              <button type="button" class="member-tab" data-notif-filter="unread">UNREAD</button>
              <button type="button" class="member-tab" data-notif-filter="read">READ</button>

      <footer class="member-footer">TALHA GOLD GYM <span>Jama Hari Masjid, Kumbhar Wara Road, Lyari, Karachi, Pakistan</span></footer>
